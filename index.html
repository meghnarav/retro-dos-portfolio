<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>~/meghnarav</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0000AA;
      --bg-panel: #000039;
      --bg-titlebar: #AAAAAA;
      --fg: #AAAAAA;
      --fg-bright: #FFFFFF;
      --accent-yellow: #FFFF55;
      --accent-cyan: #55FFFF;
      --accent-red: #FF5555;
      --accent-green: #55FF55;
      --font-display: 'VT323', monospace;
      --font-body: 'JetBrains Mono', 'IBM Plex Mono', 'Courier New', monospace;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000015;
      font-family: var(--font-body);
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
    }

    .crt-wrap {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .terminal {
      width: 100%;
      max-width: 900px;
      height: 88vh;
      max-height: 700px;
      background: var(--bg);
      border-radius: 6px;
      box-shadow: 0 0 0 2px #000, 0 20px 60px rgba(0,0,0,0.6), inset 0 0 80px rgba(0,0,0,0.35);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .terminal::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.035) 0px,
        rgba(255,255,255,0.035) 1px,
        transparent 1px,
        transparent 3px
      );
      mix-blend-mode: overlay;
    }

    .titlebar {
      background: var(--bg-titlebar);
      color: #000;
      font-family: var(--font-display);
      font-size: 18px;
      letter-spacing: 0.5px;
      padding: 4px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
      flex-shrink: 0;
    }

    .titlebar-dots { display: flex; gap: 6px; }
    .titlebar-dots span {
      width: 11px;
      height: 11px;
      display: inline-block;
      background: #000039;
      border: 1px solid #000;
    }

    .screen {
      flex: 1;
      overflow-y: auto;
      padding: 18px 20px 8px 20px;
      color: var(--fg);
      font-size: 15px;
      line-height: 1.5;
      scrollbar-width: thin;
      scrollbar-color: var(--fg) var(--bg);
    }
    .screen::-webkit-scrollbar { width: 10px; }
    .screen::-webkit-scrollbar-thumb { background: var(--fg); }
    .screen::-webkit-scrollbar-track { background: var(--bg); }

    .line { white-space: pre-wrap; word-break: break-word; margin: 0 0 2px 0; }
    .fg-bright { color: var(--fg-bright); font-weight: 600; }
    .fg-yellow { color: var(--accent-yellow); }
    .fg-cyan { color: var(--accent-cyan); }
    .fg-red { color: var(--accent-red); }
    .fg-green { color: var(--accent-green); }
    .ascii { font-family: var(--font-display); font-size: 15px; line-height: 1.15; color: var(--accent-cyan); }

    .cmd-echo { color: var(--fg-bright); }
    .cmd-echo .prompt-tag { color: var(--accent-yellow); }

    .proj-item { margin: 6px 0 10px 0; padding-left: 10px; border-left: 2px solid var(--accent-yellow); }
    .proj-name { color: var(--fg-bright); font-weight: 700; }
    .proj-tags { color: var(--accent-cyan); font-size: 13px; }

    a { color: var(--accent-cyan); }
    a:visited { color: var(--accent-cyan); }

    .inputbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 20px 10px 20px;
      background: var(--bg);
      border-top: 1px solid rgba(255,255,255,0.15);
    }
    .prompt-label { color: var(--accent-yellow); font-weight: 700; white-space: nowrap; }
    .prompt-input-wrap { flex: 1; position: relative; }
    #cmdInput {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--fg-bright);
      font-family: var(--font-body);
      font-size: 15px;
      caret-color: var(--accent-yellow);
    }
    #cmdInput:focus-visible {
      outline: 2px solid var(--accent-cyan);
      outline-offset: 2px;
    }

    .hotkeys {
      flex-shrink: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 0;
      background: var(--bg-titlebar);
      font-family: var(--font-display);
      font-size: 14px;
    }
    .hotkey {
      flex: 1 1 auto;
      min-width: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 6px 4px;
      background: var(--bg-titlebar);
      color: #000;
      border: none;
      border-right: 1px solid #7a7a7a;
      cursor: pointer;
      font-family: var(--font-display);
      font-size: 14px;
    }
    .hotkey:last-child { border-right: none; }
    .hotkey:hover, .hotkey:focus-visible { background: var(--accent-cyan); }
    .hotkey b { background: #000; color: var(--accent-yellow); padding: 0 3px; }

    .skip-note {
      text-align: center;
      color: #5a5aef;
      font-size: 12px;
      font-family: var(--font-body);
      margin-top: 10px;
    }

    @media (max-width: 640px) {
      .terminal { height: 94vh; max-height: none; border-radius: 0; }
      .screen { font-size: 13px; }
      .hotkey { font-size: 12px; min-width: 56px; }
    }
  </style>
</head>
<body>

<div class="crt-wrap">
  <div class="terminal" id="terminal">
    <div class="titlebar">
      <span id="titleText">MEGHNARAV@PORTFOLIO.EXE</span>
      <div class="titlebar-dots"><span></span><span></span><span></span></div>
    </div>
    <div class="screen" id="screen" tabindex="-1" aria-live="polite"></div>
    <div class="inputbar">
      <span class="prompt-label" id="promptLabel">meghnarav@portfolio:~$</span>
      <div class="prompt-input-wrap">
        <input id="cmdInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Terminal command input" />
      </div>
    </div>
    <div class="hotkeys" id="hotkeys"></div>
  </div>
</div>
<div class="skip-note">Type <b style="color:#FFFF55">help</b> for commands &middot; Tab to autocomplete &middot; &uarr;/&darr; for history</div>

<script>
const CONFIG = {
  name: "Meghna Ravikumar",
  handle: "meghnarav",
  title: "Backend & Systems Engineer",
  bootLines: [
    "BIOS-DOS v6.22 initializing...",
    "Connecting to ~/meghnarav...",
    "Loading resume.dat [OK]",
    "Loading projects.db [OK]",
    "Terminal initialized."
  ],
  about:
`I'm a backend software engineer focused on distributed systems, payment infrastructure, and high-throughput architectures. 

My primary toolkit revolves around Java and Spring Boot. I spend most of my time working through the mechanics of reliable systems: concurrency controls, data consistency under load, idempotency keys, and transaction management across microservices.`,
  education: {
    school: "Vellore Institute of Technology, Chennai",
    degree: "B.Tech in Computer Science Engineering (AI & ML)",
    gpa: "8.97 / 10",
    period: "2024 - 2028"
  },
  skills: {
    "Languages": ["Java", "Python", "SQL", "C++", "JavaScript", "TypeScript"],
    "Backend & Frameworks": ["Spring Boot", "Spring Security", "Hibernate/JPA", "RESTful APIs", "JWT"],
    "Databases & Storage": ["PostgreSQL", "MySQL", "Redis", "Oracle"],
    "Architecture & Systems": ["Apache Kafka", "Transactional Outbox", "Distributed Locking", "Rate Limiting", "Caching Strategies"],
    "Tools & Infrastructure": ["Docker", "AWS (EC2, S3)", "Git", "GitHub Actions", "Prometheus", "Grafana", "k6"]
  },
  projects: [
    {
      name: "NomosPay — Distributed Payment Processing Platform",
      tags: "Java 21 · Spring Boot · PostgreSQL · Redis · Kafka · Docker · Stripe Sandbox",
      desc: "Architected a double-entry ledger backend featuring idempotent payment endpoints, RBAC authentication, sliding-window rate limiting via Redis, and event synchronization using Kafka with the Transactional Outbox Pattern.",
      link: "",
      date: ""
    },
    {
      name: "Koncertify — High-Concurrency Ticket Booking System",
      tags: "Java 21 · Spring Boot · PostgreSQL · Redis · Next.js · TypeScript",
      desc: "Engineered an event ticketing platform using transactional locking to eliminate race conditions and overbooking. Validated against high-concurrency traffic using k6 load tests at 1,000 concurrent VUs.",
      link: "",
      date: ""
    },
    {
      name: "Inference Token Gateway — AI Proxy & Rate Limiter",
      tags: "Java 21 · Spring Boot · Redis · PostgreSQL · Docker",
      desc: "Built a high-throughput API gateway for machine learning endpoints, enforcing tenant quotas, usage telemetry, and API key validation using Redis sliding-window algorithms.",
      link: "",
      date: ""
    }
  ],
  achievements: [
    "Runner-Up, NeuralDAO Hackathon 2025 (Blockchain Track)",
    "Open Source Contributor, GirlScript Summer of Code (GSSoC) 2026"
  ],
  contact: {
    email: "meghnaravikumar06@gmail.com",
    github: "https://github.com/meghnarav",
    linkedin: "https://linkedin.com/in/meghna-ravikumar",
    resume: ""
  }
};

const screen = document.getElementById('screen');
const input = document.getElementById('cmdInput');
const hotkeysEl = document.getElementById('hotkeys');
const promptLabel = document.getElementById('promptLabel');
const titleText = document.getElementById('titleText');

let history = [];
let historyIdx = -1;

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function printLine(html, cls) {
  const div = document.createElement('div');
  div.className = 'line' + (cls ? ' ' + cls : '');
  div.innerHTML = html;
  screen.appendChild(div);
  screen.scrollTop = screen.scrollHeight;
}

function printBlank() { printLine('&nbsp;'); }

function buildBanner(text) {
  const label = ` ${text.toUpperCase().split('').join(' ')} `;
  const border = '+' + '-'.repeat(label.length) + '+';
  return `${border}\n|${label}|\n${border}`;
}

const COMMANDS = ["help", "about", "whoami", "projects", "skills", "education", "achievements", "contact", "ls", "clear", "sudo", "exit"];

function renderHelp() {
  printLine(`<span class="fg-bright">AVAILABLE COMMANDS</span>`);
  const rows = [
    ["about", "background and focus areas"],
    ["projects", "production and open-source builds"],
    ["skills", "languages, frameworks, and tools"],
    ["education", "academic background"],
    ["achievements", "hackathons and program milestones"],
    ["contact", "reach out / social links"],
    ["whoami", "identity check"],
    ["ls", "list available commands"],
    ["clear", "clear screen buffer"]
  ];
  rows.forEach(([c, d]) => {
    printLine(`  <span class="fg-yellow">${c.padEnd(14, ' ')}</span>${esc(d)}`);
  });
  printBlank();
  printLine(`Tip: Use <span class="fg-cyan">Tab</span> for autocomplete, <span class="fg-cyan">&uarr;/&darr;</span> for history.`);
}

function renderAbout() {
  printLine(`<span class="fg-bright">ABOUT</span>`);
  printLine(esc(CONFIG.about));
}

function renderWhoami() {
  printLine(`${esc(CONFIG.handle)}: ${esc(CONFIG.title)}`);
}

function renderProjects() {
  printLine(`<span class="fg-bright">PROJECTS</span> (${CONFIG.projects.length})`);
  CONFIG.projects.forEach((p, i) => {
    printLine(
      `<div class="proj-item">` +
      `<span class="proj-name">${String(i + 1).padStart(2, '0')}. ${esc(p.name)}</span>${p.date ? `  <span class="proj-tags">[${esc(p.date)}]</span>` : ''}\n` +
      `<span class="proj-tags">${esc(p.tags)}</span>\n` +
      `${esc(p.desc)}\n` +
      (p.link ? `<a href="${esc(p.link)}" target="_blank" rel="noopener noreferrer">${esc(p.link)}</a>` : '') +
      `</div>`
    );
  });
}

function renderEducation() {
  const e = CONFIG.education;
  printLine(`<span class="fg-bright">EDUCATION</span>`);
  printLine(`<span class="fg-yellow">${esc(e.school)}</span>`);
  printLine(`${esc(e.degree)}`);
  printLine(`<span class="proj-tags">GPA: ${esc(e.gpa)}${e.period ? '  &middot;  ' + esc(e.period) : ''}</span>`);
}

function renderSkills() {
  printLine(`<span class="fg-bright">SKILLS</span>`);
  Object.entries(CONFIG.skills).forEach(([cat, items]) => {
    printLine(`<span class="fg-yellow">${esc(cat)}:</span> ${esc(items.join(', '))}`);
  });
}

function renderAchievements() {
  printLine(`<span class="fg-bright">ACHIEVEMENTS</span>`);
  CONFIG.achievements.forEach(a => printLine(`  * ${esc(a)}`));
}

function renderContact() {
  const c = CONFIG.contact;
  printLine(`<span class="fg-bright">CONTACT</span>`);
  printLine(`Email:    <a href="mailto:${esc(c.email)}">${esc(c.email)}</a>`);
  printLine(`GitHub:   <a href="${esc(c.github)}" target="_blank" rel="noopener noreferrer">${esc(c.github)}</a>`);
  printLine(`LinkedIn: <a href="${esc(c.linkedin)}" target="_blank" rel="noopener noreferrer">${esc(c.linkedin)}</a>`);
  if (c.resume && c.resume !== "#") {
    printLine(`Resume:   <a href="${esc(c.resume)}" target="_blank" rel="noopener noreferrer">${esc(c.resume)}</a>`);
  }
}

function runCommand(raw) {
  const cmd = raw.trim().toLowerCase();
  printLine(`<span class="cmd-echo"><span class="prompt-tag">meghnarav@portfolio:~$</span> ${esc(raw)}</span>`);
  if (cmd === '') return;

  switch (cmd) {
    case 'help':
    case 'ls':
      renderHelp();
      break;
    case 'about':
      renderAbout();
      break;
    case 'whoami':
      renderWhoami();
      break;
    case 'projects':
      renderProjects();
      break;
    case 'skills':
      renderSkills();
      break;
    case 'education':
      renderEducation();
      break;
    case 'achievements':
      renderAchievements();
      break;
    case 'contact':
      renderContact();
      break;
    case 'clear':
      screen.innerHTML = '';
      break;
    case 'sudo':
      printLine(`<span class="fg-red">Permission denied: user is not in the sudoers file. Incident logged.</span>`);
      break;
    case 'exit':
      printLine(`<span class="fg-red">Session active. Close tab to exit.</span>`);
      break;
    default:
      printLine(`<span class="fg-red">Command not recognized: ${esc(cmd)}</span>. Run <span class="fg-yellow">help</span> for a list of commands.`);
  }
  printBlank();
}

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const val = input.value;
    if (val.trim() !== '') history.push(val);
    historyIdx = history.length;
    runCommand(val);
    input.value = '';
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (historyIdx > 0) {
      historyIdx--;
      input.value = history[historyIdx] || '';
    }
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (historyIdx < history.length - 1) {
      historyIdx++;
      input.value = history[historyIdx] || '';
    } else {
      historyIdx = history.length;
      input.value = '';
    }
  } else if (e.key === 'Tab') {
    e.preventDefault();
    const partial = input.value.trim().toLowerCase();
    if (partial) {
      const match = COMMANDS.find(c => c.startsWith(partial));
      if (match) input.value = match;
    }
  }
});

const HOTKEYS = [
  ["F2", "help"], ["F3", "about"], ["F4", "projects"],
  ["F6", "skills"], ["F7", "education"], ["F8", "achievements"],
  ["F9", "contact"], ["F10", "clear"]
];

HOTKEYS.forEach(([key, cmd]) => {
  const btn = document.createElement('button');
  btn.className = 'hotkey';
  btn.innerHTML = `<b>${key}</b> ${cmd}`;
  btn.addEventListener('click', () => {
    input.value = cmd;
    runCommand(cmd);
    input.value = '';
    input.focus();
  });
  hotkeysEl.appendChild(btn);
});

document.addEventListener('keydown', (e) => {
  const match = HOTKEYS.find(([key]) => key === e.key);
  if (match) {
    e.preventDefault();
    runCommand(match[1]);
    input.focus();
  }
});

async function boot() {
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  for (const line of CONFIG.bootLines) {
    printLine(`<span class="fg-cyan">${esc(line)}</span>`);
    await new Promise(r => setTimeout(r, reduced ? 0 : 150));
  }
  printBlank();
  printLine(`<pre class="ascii">${esc(buildBanner(CONFIG.handle))}</pre>`);
  printBlank();
  printLine(`<span class="fg-bright">Connected to ${esc(CONFIG.handle)}'s shell environment.</span>`);
  printLine(`${esc(CONFIG.title)}`);
  printBlank();
  printLine(`Type <span class="fg-yellow">help</span> or use function keys below.`);
  printBlank();
  titleText.textContent = `${CONFIG.handle.toUpperCase()}@PORTFOLIO.EXE`;
  input.focus();
}

boot();
document.getElementById('terminal').addEventListener('click', () => input.focus());
</script>
</body>
</html>
